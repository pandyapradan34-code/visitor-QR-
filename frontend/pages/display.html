<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visitor Moments</title>


    <link
        rel="stylesheet"
        href="/css/display.css"
    >

</head>


<body>


    <!-- ==========================================
         MAIN DISPLAY
    =========================================== -->

    <main class="display-page">


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-logo">
                    VM
                </div>


                <div>

                    <h1>
                        Visitor Moments
                    </h1>

                    <p>
                        Capture • Share • Remember
                    </p>

                </div>

            </div>


            <div class="live-status">

                <span class="live-dot"></span>

                <span>
                    LIVE
                </span>

            </div>

        </header>



        <!-- ======================================
             EMPTY STATE
        ======================================= -->

        <section
            id="empty"
            class="empty-state"
        >

            <div class="empty-icon">
                📸
            </div>


            <h2>
                Waiting for the next visitor
            </h2>


            <p>
                New visitor photos will appear here automatically.
            </p>


            <div class="loading-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </section>



        <!-- ======================================
             PHOTO DISPLAY
        ======================================= -->

        <section
            id="gallery"
            class="gallery d-none"
        >


            <!-- VISITOR INFO -->

            <div class="visitor-info">

                <div class="welcome-text">
                    Welcome
                </div>


                <h2 id="visitorName">
                    Visitor
                </h2>


                <div class="photo-count">
                    <span id="photoNumber">
                        1
                    </span>

                    <span>
                        /
                    </span>

                    <span id="photoTotal">
                        1
                    </span>

                </div>

            </div>



            <!-- MAIN PHOTO -->

            <div class="photo-area">


                <button
                    id="previousButton"
                    class="navigation-button previous"
                    aria-label="Previous photo"
                >
                    ‹
                </button>


                <div class="main-photo-wrapper">

                    <img
                        id="mainPhoto"
                        src=""
                        alt="Visitor photo"
                    >

                </div>


                <button
                    id="nextButton"
                    class="navigation-button next"
                    aria-label="Next photo"
                >
                    ›
                </button>


            </div>



            <!-- THUMBNAILS -->

            <div
                id="thumbnailContainer"
                class="thumbnail-container"
            >
            </div>



            <!-- PROGRESS -->

            <div class="progress-container">

                <div
                    id="progressBar"
                    class="progress-bar"
                >
                </div>

            </div>


            <div class="auto-play-text">
                Auto playing visitor memories
            </div>


        </section>



        <!-- FOOTER -->

        <footer class="display-footer">

            <span>
                Visitor Moments
            </span>

            <span>
                Memories that stay
            </span>

        </footer>


    </main>


    <script src="/js/display.js"></script>

</body>

</html>
