<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visitor Photo Slideshow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">Visitor Photo Slideshow</span><a class="btn btn-outline-light btn-sm" href="/display">Display</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm"><div class="card-body p-4"><h2>Visitor Registration</h2><p class="text-muted">Register or return using your mobile number.</p><form id="visitorForm"><div class="mb-3"><label class="form-label">Name</label><input id="name" class="form-control" required maxlength="100"></div><div class="mb-3"><label class="form-label">Mobile Number</label><input id="phone" class="form-control" required maxlength="20"></div><button class="btn btn-primary w-100">Continue</button></form><div id="msg" class="mt-3"></div><div id="uploadBox" class="d-none mt-4"><hr><h4>Upload Photos</h4><form id="uploadForm"><input type="file" id="photos" name="photos" class="form-control mb-3" accept="image/jpeg,image/png,image/webp" multiple required><div class="form-text mb-3">Maximum 10 photos, 5 MB each. JPG, PNG or WEBP.</div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="consent"><label class="form-check-label" for="consent">I give permission for my uploaded photos to be displayed publicly on the visitor slideshow.</label></div><button class="btn btn-success w-100">Upload Photos</button></form></div></div></div></div></main><script src="/js/app.js"></script></body></html>
